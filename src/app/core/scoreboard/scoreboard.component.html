<table mat-table [dataSource]="brackets$" [trackBy]="trackByKey">
  <!-- Position -->
  <ng-container matColumnDef="position">
    <th class="text-center" mat-header-cell *matHeaderCellDef>#</th>
    <td class="text-center" mat-cell *matCellDef="let index = index">{{ index + 1 }}</td>
  </ng-container>
  <!-- Bracket Name -->
  <ng-container matColumnDef="bracketName">
    <th mat-header-cell *matHeaderCellDef>Bracket Name</th>
    <td mat-cell *matCellDef="let bracket">{{ bracket.name }}</td>
  </ng-container>
  <!-- Owner -->
  <ng-container matColumnDef="owner">
    <th class="text-center" mat-header-cell *matHeaderCellDef>Owner</th>
    <td class="text-center" mat-cell *matCellDef="let bracket">{{ bracket.owner.name }}</td>
  </ng-container>
  <!-- Champs -->
  <ng-container matColumnDef="champs">
    <th class="text-center" mat-header-cell *matHeaderCellDef>Cup Champs</th>
    <td class="text-center" mat-cell *matCellDef="let bracket">Pittsburgh Penguins</td>
  </ng-container>
  <!-- Score -->
  <ng-container matColumnDef="score">
    <th class="text-center" mat-header-cell *matHeaderCellDef>Score</th>
    <td class="text-center" mat-cell *matCellDef="let bracket">{{ bracket.score }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
  <tr mat-row *matRowDef="let row; let index = index; columns: displayedColumns;" [ngClass]="{'cash-line': cashLine == index}"></tr>
</table>

<div>
  <a href="" data-toggle="modal" data-target="#pointsModal">How do I earn points?</a>
</div>
