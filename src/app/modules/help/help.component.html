<h1 id="pointsModalLabel">Points Legend</h1>

<table mat-table [dataSource]="data" class="mat-elevation-z8">
  <ng-container matColumnDef="round">
    <th mat-header-cell *matHeaderCellDef>Correct Prediction</th>
    <td mat-cell *matCellDef="let element"> {{element.round}} </td>
  </ng-container>

  <ng-container matColumnDef="points">
    <th mat-header-cell *matHeaderCellDef>Points</th>
    <td mat-cell *matCellDef="let element"> {{element.points}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<p>Points are awarded for every correct prediction.</p>
<p>Ex: Round 1 has 8 predictions and a possible 16 total points.</p>
<p>Bonus point awarded for every correct total games per series prediction.</p>
